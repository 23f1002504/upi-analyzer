services:
  ollama:
    image: ollama/ollama:latest
    container_name: upi-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upi-backend
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - ./data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
 
volumes:
  ollama_data:
  chroma_data:
 